services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: company_search
      POSTGRES_USER: company_search
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_search -d company_search"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
