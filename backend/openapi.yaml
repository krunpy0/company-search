openapi: 3.1.0
info:
  title: Company Search
  version: 1.0.0
  description: Local coverage is limited to published FNS releases. DaData is disabled by default. External calls count against user and provider budgets. Local reads remain available when external quota is exhausted.
servers:
  - url: /
    description: API server
security:
  - bearerAuth: []
paths:
  /v1/auth/register:
    post:
      operationId: registerUser
      summary: Register an account with an email address and password.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RegisteredUser'}
        '400': {$ref: '#/components/responses/InvalidCredentialsInput'}
        '409':
          description: An account with this email address already exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/AuthBusy'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /v1/auth/login:
    post:
      operationId: loginUser
      summary: Start a session that expires after 24 hours.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: Session created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '400': {$ref: '#/components/responses/InvalidCredentialsInput'}
        '401':
          description: Invalid email address or password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/AuthBusy'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /v1/auth/logout:
    post:
      operationId: logoutUser
      summary: Revoke the current session.
      responses:
        '204':
          description: Session revoked.
        '401': {$ref: '#/components/responses/SessionRequired'}
        '503': {$ref: '#/components/responses/AuthUnavailable'}
  /v1/chat/dialogues:
    get:
      operationId: listChatDialogues
      summary: List the current user's dialogues, newest ID first.
      parameters:
        - $ref: '#/components/parameters/ChatBeforeId'
        - $ref: '#/components/parameters/ChatPageSize'
      responses:
        '200':
          description: Page of dialogues.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatDialoguePage'}
        '400': {$ref: '#/components/responses/ChatInvalidInput'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '503': {$ref: '#/components/responses/ChatUnavailable'}
    post:
      operationId: createChatDialogue
      summary: Create a dialogue with an optional selected registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                registration:
                  oneOf:
                    - {$ref: '#/components/schemas/ChatRegistration'}
                    - {type: string, const: ''}
                    - {type: 'null'}
      responses:
        '201':
          description: Dialogue created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatDialogue'}
        '400': {$ref: '#/components/responses/ChatInvalidInput'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '503': {$ref: '#/components/responses/ChatUnavailable'}
  /v1/chat/dialogues/{id}/messages:
    parameters:
      - name: id
        in: path
        required: true
        schema: {$ref: '#/components/schemas/ChatId'}
    get:
      operationId: listChatMessages
      summary: Read completed turns in the current user's dialogue, newest ID first.
      parameters:
        - $ref: '#/components/parameters/ChatBeforeId'
        - $ref: '#/components/parameters/ChatPageSize'
      responses:
        '200':
          description: Dialogue and page of completed turns.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatHistory'}
        '400': {$ref: '#/components/responses/ChatInvalidInput'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '404': {$ref: '#/components/responses/ChatNotFound'}
        '503': {$ref: '#/components/responses/ChatUnavailable'}
    post:
      operationId: sendChatMessage
      summary: Ask a question and wait for the full answer or a registration choice.
      description: If the dialogue has candidates, send a candidate registration as the entire message to resume the original question.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: {type: string, minLength: 1, maxLength: 2000}
      responses:
        '201':
          description: Completed turn saved.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ChatTurn'}
        '400': {$ref: '#/components/responses/ChatInvalidInput'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '404': {$ref: '#/components/responses/ChatNotFound'}
        '409':
          description: Another turn is already running in this dialogue (turn_in_progress).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: Message budget, token budget or server concurrency limit reached (message_budget_exhausted, token_budget_exhausted or busy).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/ChatUnavailable'}
  /v1/companies:
    get:
      operationId: searchCompanies
      summary: Search published FNS observations and optional DaData registrations.
      parameters:
        - name: q
          in: query
          required: true
          description: 'Company name or a bare INN, OGRN or OGRNIP number. For exact lookups omit the inn:/reg: prefix used by detail tools.'
          schema: {type: string, minLength: 1, maxLength: 200}
        - name: mode
          in: query
          required: false
          schema: {type: string, enum: [auto, inn, registration, name], default: auto}
        - name: kind
          in: query
          required: false
          schema: {type: string, enum: [legal, entrepreneur]}
        - name: limit
          in: query
          required: false
          description: Local page size. Exact searches can also return DaData registrations on the first page.
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          required: false
          schema: {type: string, maxLength: 4096}
      responses:
        '200':
          description: Exact names rank before trigram matches in the local results.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Search'}
        '400':
          description: Invalid parameter, ID or cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '409':
          description: Published releases changed. Restart search without a cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: The local request concurrency limit was reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Session data or local data unavailable, or exact lookup needs DaData and the provider call could not complete.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/companies/{id}:
    get:
      operationId: getCompany
      summary: Get the profile and section availability.
      parameters:
        - name: id
          in: path
          required: true
          description: Key returned by search. An INN with multiple registrations returns 409.
          schema: {type: string, pattern: '^(reg:([0-9]{13}|[0-9]{15})|inn:([0-9]{10}|[0-9]{12}))$'}
      responses:
        '200':
          description: Get the profile and section availability.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Profile'}
        '400':
          description: Invalid parameter, ID or cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '404':
          description: No matching subject in the checked sources.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: The INN matches multiple registrations. Select a candidate ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: The local request concurrency limit was reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Session data or local data unavailable, or the subject could not be resolved without DaData.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/companies/{id}/financials:
    get:
      operationId: getCompanyFinancials
      summary: Get annual income and expenses by taxpayer INN.
      parameters:
        - name: id
          in: path
          required: true
          description: Key returned by search. An INN with multiple registrations returns 409.
          schema: {type: string, pattern: '^(reg:([0-9]{13}|[0-9]{15})|inn:([0-9]{10}|[0-9]{12}))$'}
        - name: year
          in: query
          required: false
          schema: {type: integer, minimum: 1900, maximum: 9999}
      responses:
        '200':
          description: Get annual income and expenses by taxpayer INN.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Financials'}
        '400':
          description: Invalid parameter, ID or cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '404':
          description: No matching subject in published local data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: The INN matches multiple registrations. Select a candidate ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: The local request concurrency limit was reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Session data or local data temporarily unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/companies/{id}/taxes:
    get:
      operationId: getCompanyTaxes
      summary: Get published tax payments, debts or special regimes.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, pattern: '^(reg:([0-9]{13}|[0-9]{15})|inn:([0-9]{10}|[0-9]{12}))$'}
        - name: section
          in: query
          description: Select one section per call. For regimes only id and optionally as_of are needed.
          schema: {type: string, enum: [payments, debts, regimes], default: regimes}
        - name: as_of
          in: query
          description: Exact observation date for debts and regimes. Defaults to the latest loaded snapshot for the subject type.
          schema: {type: string, format: date}
        - name: year
          in: query
          description: Exact report year for payments. Defaults to all loaded years.
          schema: {type: integer, minimum: 1900, maximum: 9999}
        - name: limit
          in: query
          description: Payment or debt page size. Omit for regimes.
          schema: {type: integer, minimum: 1, maximum: 100, default: 100}
        - name: offset
          in: query
          description: Use next_offset from the previous payment or debt page. Omit for regimes.
          schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}
      responses:
        '200':
          description: The selected snapshot and its observations.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TaxRegimes'
                  - $ref: '#/components/schemas/MoneyTaxes'
        '400':
          description: Invalid ID, date or section.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '404':
          description: No matching company in the checked sources.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: The INN matches multiple registrations. Select a candidate ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: The local request concurrency limit was reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Session data or local data unavailable, or the subject could not be resolved without DaData.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/companies/{id}/sources:
    get:
      operationId: getCompanySources
      summary: Get the releases and documents used by the company response.
      parameters:
        - name: id
          in: path
          required: true
          description: Key returned by search. An INN with multiple registrations returns 409.
          schema: {type: string, pattern: '^(reg:([0-9]{13}|[0-9]{15})|inn:([0-9]{10}|[0-9]{12}))$'}
      responses:
        '200':
          description: Get the releases and documents used by the company response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Observations'}
        '400':
          description: Invalid parameter, ID or cursor.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/SessionRequired'}
        '404':
          description: No matching subject in published local data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: The INN matches multiple registrations. Select a candidate ID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: The local request concurrency limit was reached.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: Session data or local data temporarily unavailable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
components:
  parameters:
    ChatBeforeId:
      name: before_id
      in: query
      description: Return IDs lower than this cursor. Omit it for the first page.
      schema: {$ref: '#/components/schemas/ChatId'}
    ChatPageSize:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Credentials'}
  responses:
    InvalidCredentialsInput:
      description: Invalid email address, password or JSON body.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChatInvalidInput:
      description: Invalid JSON, registration, dialogue ID, pagination, message or pending selection (invalid_json, invalid_registration, invalid_dialogue_id, invalid_pagination, invalid_message or registration_selection_required).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChatNotFound:
      description: The current user has no dialogue with this ID (dialogue_not_found).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    ChatUnavailable:
      description: Session or chat data unavailable, or model unavailable for sending (auth_unavailable, chat_unavailable or model_unavailable).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    SessionRequired:
      description: Bearer session missing, invalid, expired or revoked.
      headers:
        WWW-Authenticate:
          schema: {type: string, const: Bearer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthUnavailable:
      description: Account or session data temporarily unavailable.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    AuthBusy:
      description: The local authentication concurrency limit was reached.
      headers:
        Retry-After:
          schema: {type: integer}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    ChatId:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    ChatRegistration:
      type: string
      pattern: '^(reg:)?([0-9]{13}|[0-9]{15})$'
    ChatDialogue:
      type: object
      required: [id, created_at, updated_at]
      properties:
        title: {type: string, maxLength: 80}
        id: {$ref: '#/components/schemas/ChatId'}
        registration: {$ref: '#/components/schemas/ChatRegistration'}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/ChatRegistration'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ChatTurn:
      type: object
      required: [id, question, answer, created_at]
      properties:
        id: {$ref: '#/components/schemas/ChatId'}
        question: {type: string}
        answer: {$ref: '#/components/schemas/ChatAnswer'}
        created_at: {type: string, format: date-time}
    ChatAnswer:
      type: object
      required: [summary]
      properties:
        summary: {type: string}
        partial: {type: boolean}
        candidates:
          type: array
          items: {$ref: '#/components/schemas/ChatRegistration'}
        records:
          type: array
          items:
            type: object
            required: [tool, source_ref, as_of, source, record]
            properties:
              subject: {type: string}
              tool: {type: string}
              source_ref: {type: string}
              as_of: {type: [string, 'null'], format: date}
              source: {type: object, additionalProperties: true}
              record: {type: object, additionalProperties: true}
        findings:
          type: array
          items:
            type: object
            required: [tool, details]
            properties:
              tool: {type: string}
              arguments: {}
              details: {type: [object, 'null'], additionalProperties: true}
    ChatDialoguePage:
      type: object
      required: [dialogues]
      properties:
        dialogues:
          type: array
          items: {$ref: '#/components/schemas/ChatDialogue'}
        next_before_id: {$ref: '#/components/schemas/ChatId'}
    ChatHistory:
      type: object
      required: [dialogue, messages]
      properties:
        dialogue: {$ref: '#/components/schemas/ChatDialogue'}
        messages:
          type: array
          items: {$ref: '#/components/schemas/ChatTurn'}
        next_before_id: {$ref: '#/components/schemas/ChatId'}
    Credentials:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password:
          type: string
          format: password
          writeOnly: true
          description: 12 to 72 UTF-8 bytes.
    RegisteredUser:
      type: object
      required: [user_id]
      properties:
        user_id: {type: string}
    Session:
      type: object
      required: [access_token, token_type, expires_at]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_at: {type: string, format: date-time}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
            candidates: {type: array, items: {type: string}}
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Warning'}
    Warning:
      type: object
      required: [source, code]
      properties:
        source: {type: string}
        code:
          type: string
          description: user_external_api_budget_exhausted means the user has used their daily allowance for external API calls.
    Evidence:
      type: object
      required: [source_ref, as_of, document_id, file]
      properties:
        source_ref: {type: string}
        as_of: {type: string, format: date}
        document_id: {type: string}
        file: {type: string}
        document_date: {type: string, format: date}
    Name:
      allOf:
        - $ref: '#/components/schemas/Evidence'
        - type: object
          required: [value]
          properties:
            value: {type: string}
    Identity:
      type: object
      required: [id, kind, inn, registration_number, name, registration_evidence]
      properties:
        id: {type: string}
        kind: {type: string, enum: [legal, entrepreneur]}
        inn: {type: string}
        registration_number: {type: [string, 'null']}
        registration_evidence:
          oneOf:
            - $ref: '#/components/schemas/Evidence'
            - type: 'null'
        name:
          oneOf:
            - $ref: '#/components/schemas/Name'
            - type: 'null'
    SME:
      allOf:
        - $ref: '#/components/schemas/Evidence'
        - type: object
          required: [region_code, okved, included_on, category, subject_type, employees, employee_year]
          properties:
            region_code: {type: string}
            okved: {type: [string, 'null']}
            included_on: {type: string, format: date}
            category: {type: string, enum: ['1', '2', '3']}
            subject_type: {type: string, enum: ['1', '2', '3']}
            employees: {type: [integer, 'null'], minimum: 0}
            employee_year: {type: [integer, 'null']}
    Response:
      type: object
      required: [sources, coverage, warnings]
      properties:
        sources:
          type: object
          description: Published P0 releases keyed by source_ref.
          additionalProperties:
            type: object
            required: [publisher, dataset, published_on, period, url, download_url]
            properties:
              publisher: {type: string}
              dataset: {type: string, enum: [rsmp, revexp]}
              published_on: {type: string, format: date}
              period: {type: string}
              url: {type: string, format: uri}
              download_url: {type: string, format: uri}
              quarantined_count:
                type: integer
                minimum: 1
                description: Number of regime records withheld from this release because identifiers conflict with the SME registry. Omitted when zero.
        coverage:
          type: object
          required: [local, dadata]
          properties:
            local: {type: string, enum: [partial, not_loaded]}
            dadata:
              type: string
              enum: [disabled, not_requested, checked, limited, unavailable]
              description: Name suggestions are ranked and bounded. Exact lookup is limited if the provider reaches its result cap.
        warnings:
          type: array
          items: {$ref: '#/components/schemas/Warning'}
        dadata: {$ref: '#/components/schemas/DaDataRegistration'}
    DaDataRegistration:
      type: object
      required: [id, inn, registration_number, kind, source, source_url, as_of, retrieved_at]
      properties:
        id: {type: string}
        inn: {type: string}
        registration_number: {type: string}
        kind: {type: string, enum: [legal, entrepreneur]}
        name: {type: string}
        kpp: {type: string}
        okved: {type: string}
        status: {type: string}
        registered_on: {type: string, format: date}
        last_changed_on: {type: string, format: date}
        address: {type: string, description: Standardized address of a legal entity.}
        manager:
          type: object
          description: Optional basic management record for a legal entity on the closed stand.
          required: [name]
          properties:
            name: {type: string}
            title: {type: string}
            started_on: {type: string, format: date}
        residence_city: {type: string, description: Optional city of residence for an entrepreneur on the closed stand.}
        source: {const: dadata}
        source_url: {type: string, format: uri}
        as_of: {type: 'null', description: DaData does not provide a snapshot date for this observation.}
        retrieved_at: {type: string, format: date-time}
    Availability:
      type: string
      enum: [found, not_published, not_applicable, not_loaded, unavailable, identity_conflict]
    Section:
      type: object
      required: [state]
      properties:
        state: {$ref: '#/components/schemas/Availability'}
        years: {type: array, items: {type: integer}}
    Search:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required: [items, next_cursor]
          properties:
            items:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Identity'
                  - type: object
                    properties:
                      dadata: {$ref: '#/components/schemas/DaDataRegistration'}
            external_suggestions:
              type: array
              maxItems: 20
              description: DaData suggestions on the first page of a name search.
              items: {$ref: '#/components/schemas/DaDataRegistration'}
            next_cursor: {type: [string, 'null']}
    Profile:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required: [id, company, sections, headcounts]
          properties:
            id: {type: string}
            headcounts:
              type: array
              description: Independent observations from SME and the dedicated headcount dataset. Both can report the same year.
              items:
                allOf:
                  - $ref: '#/components/schemas/Evidence'
                  - type: object
                    required: [employees, year, scope]
                    properties:
                      employees: {type: integer, minimum: 0}
                      year: {type: integer}
                      scope: {type: string, enum: [registration, taxpayer]}
            company:
              allOf:
                - $ref: '#/components/schemas/Identity'
                - type: object
                  required: [sme]
                  properties:
                    sme:
                      oneOf:
                        - $ref: '#/components/schemas/SME'
                        - type: 'null'
            sections:
              type: object
              required: [registration, sme, financials, headcount, taxes]
              properties:
                registration: {$ref: '#/components/schemas/Section'}
                sme: {$ref: '#/components/schemas/Section'}
                financials: {$ref: '#/components/schemas/Section'}
                headcount: {$ref: '#/components/schemas/Section'}
                taxes: {$ref: '#/components/schemas/Section'}
    Financials:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required: [id, items, years, state]
          properties:
            id: {type: string}
            state: {$ref: '#/components/schemas/Availability'}
            years: {type: array, items: {type: integer}}
            items:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Evidence'
                  - type: object
                    required: [year, display_name, income, expense, currency, scope]
                    properties:
                      year: {type: integer}
                      display_name: {type: string}
                      income: {type: string}
                      expense: {type: string}
                      currency: {const: RUB}
                      scope: {const: taxpayer}
    MoneyTaxes:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required: [id, state, items, next_offset]
          properties:
            id: {type: string}
            state: {type: string, enum: [found, not_published, not_loaded, not_applicable]}
            next_offset: {type: [integer, 'null']}
            items:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Evidence'
                  - type: object
                    required: [tax_name, scope, currency]
                    properties:
                      tax_name: {type: string}
                      scope: {const: taxpayer}
                      currency: {const: RUB}
                      year: {type: integer}
                      amount: {type: string}
                      debt:
                        type: object
                        required: [principal, penalties, fines, total]
                        properties:
                          principal: {type: [string, 'null']}
                          penalties: {type: [string, 'null']}
                          fines: {type: [string, 'null']}
                          total: {type: string}
    TaxRegimes:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required: [id, state, as_of, items]
          properties:
            id: {type: string}
            state:
              type: string
              enum: [found, not_published, not_loaded, identity_conflict]
              description: With identity_conflict, the source record is withheld and items is empty.
            as_of: {type: [string, 'null'], format: date}
            items:
              type: array
              maxItems: 1
              items:
                allOf:
                  - $ref: '#/components/schemas/Evidence'
                  - type: object
                    required: [scope, codes]
                    properties:
                      scope: {type: string, enum: [taxpayer, registration]}
                      codes:
                        type: array
                        description: An empty list means the document exists with no affirmative flags. A missing document yields no item.
                        items: {type: string, enum: [eshn, usn, ausn, srp, psn, npd]}
    Observations:
      allOf:
        - $ref: '#/components/schemas/Response'
        - type: object
          required: [id, observations]
          properties:
            id: {type: string}
            observations:
              type: array
              items:
                type: object
                required: [section, evidence]
                properties:
                  section: {type: string, enum: [sme, financials, headcount, regimes]}
                  year: {type: integer}
                  evidence: {$ref: '#/components/schemas/Evidence'}
